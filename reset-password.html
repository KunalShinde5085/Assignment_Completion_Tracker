<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password — AcademicFlow</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <div class="sub">This link works once — pick a password you haven't used before.</div>
      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input id="password2" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div style="margin-top:20px;">
          <button type="submit" id="submit-btn" style="width:100%;">Update password</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { updatePassword } from './js/services/authService.js';
    import { showToast } from './js/utils/dom.js';

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1 !== p2) { showToast("Passwords don't match.", 'error'); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Updating…';
      try {
        await updatePassword(p1);
        showToast('Password updated. Redirecting to sign in…', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (err) {
        showToast(err.message || 'Could not update password.', 'error');
        btn.disabled = false; btn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
