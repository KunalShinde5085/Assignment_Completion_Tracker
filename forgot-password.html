<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — AcademicFlow</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <div class="sub">We'll email you a secure reset link.</div>
      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
        </div>
        <div style="margin-top:20px;">
          <button type="submit" id="submit-btn" style="width:100%;">Send reset link</button>
        </div>
      </form>
      <div class="switch"><a href="login.html">Back to sign in</a></div>
    </div>
  </div>

  <script type="module">
    import { sendPasswordReset } from './js/services/authService.js';
    import { showToast } from './js/utils/dom.js';

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        await sendPasswordReset(document.getElementById('email').value.trim());
        showToast('If that email exists, a reset link is on its way.', 'success');
      } catch (err) {
        showToast(err.message || 'Something went wrong.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
